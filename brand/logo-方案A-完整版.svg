<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;display=swap');
    </style>
  </defs>
  <rect width="400" height="200" fill="#F5F0EB"/>
  <!-- U+C Symbol -->
  <g transform="translate(200,60)">
    <!-- U shape -->
    <path d="M-18,-20 L-18,8 C-18,18 -8,22 0,22 C8,22 18,18 18,8 L18,-20" 
          fill="none" stroke="#3C2E26" stroke-width="2.5" stroke-linecap="round"/>
    <!-- + between -->
    <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#C8A87C" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="4" stroke="#C8A87C" stroke-width="1.5"/>
    <!-- C shape -->
    <path d="M18,-20 C-10,-20 -10,22 18,22" 
          fill="none" stroke="#3C2E26" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Type -->
  <text x="200" y="115" text-anchor="middle" font-family="'Playfair Display', serif" font-size="22" font-weight="400" letter-spacing="8" fill="#3C2E26">UNIQUE</text>
  <text x="200" y="142" text-anchor="middle" font-family="'Playfair Display', serif" font-size="22" font-weight="400" letter-spacing="8" fill="#3C2E26">CHERISH</text>
  <!-- Tagline -->
  <text x="200" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" letter-spacing="4" fill="#C8A87C">JEWELRY YOUR SKIN WILL LOVE</text>
  <!-- Decorative line -->
  <line x1="160" y1="152" x2="240" y2="152" stroke="#C8A87C" stroke-width="0.5"/>
</svg>